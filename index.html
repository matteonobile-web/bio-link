<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linktree Pro - Matteo Nobile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Poppins', sans-serif;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 20px;
background-color: #000;
background-size: cover;
background-position: center;
background-attachment: fixed;
transition: 0.4s;
position: relative;
}
body.dark-mode::before {
content: "";
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
backdrop-filter: brightness(40%);
-webkit-backdrop-filter: brightness(40%);
z-index: -1;
}
body.dark-mode {
color: #e0e0e0;
}
body.dark-mode .btn {
background: rgba(0, 0, 0, 0.4) !important;
border: 1px solid rgba(255, 255, 255, 0.1) !important;
color: #e0e0e0;
}
body.dark-mode .btn i {
color: #3498db;
}
body.dark-mode #theme-toggle {
background: rgba(255, 255, 255, 0.15) !important;
border: 1px solid rgba(255, 255, 255, 0.2) !important;
}
header {
text-align: center;
margin: 20px 0;
}
.profile-img {
width: 110px;
height: 110px;
border-radius: 50%;
border: 2px solid #fff;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
object-fit: cover;
}
h1 {
color: #ffffff;
font-size: 22px;
margin-top: 15px;
margin-bottom: 5px;
}
.subtitle {
color: #f1f2f6;
font-size: 0.75rem;
text-transform: uppercase;
margin: 0;
}
.container {
width: 100%;
max-width: 420px;
display: flex;
flex-direction: column;
gap: 12px;
}
.btn {
display: flex;
align-items: center;
justify-content: center;
text-decoration: none;
padding: 18px;
border-radius: 12px;
font-weight: 500;
transition: 0.3s;
background: rgba(255, 255, 255, 0.15);
border: 1px solid rgba(255, 255, 255, 0.2);
backdrop-filter: blur(15px);
color: #fff;
}
.btn i {
margin-right: 12px;
font-size: 1.3rem;
color: #e74c3c;
}
.btn:hover {
background: rgba(255, 255, 255, 0.25);
transform: translateY(-4px);
}
.toggle-container {
margin-top: 40px;
margin-bottom: 20px;
}
#theme-toggle {
background: rgba(255, 255, 255, 0.1);
color: #ffffff;
border: 1px solid rgba(255, 255, 255, 0.3);
padding: 12px 24px;
border-radius: 30px;
cursor: pointer;
font-size: 0.85rem;
font-family: 'Poppins', sans-serif;
transition: 0.3s;
}
footer {
margin-top: auto;
padding: 20px 0;
}
footer p {
color: rgba(255,255,255,0.4);
font-size: 0.65rem;
text-transform: uppercase;
}
</style>
</head>
<body style="background-image: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.8) 100%), url('https://preview.redd.it/whats-yalls-pc-wallpapers-ill-go-first-v0-1uhd4skp2aud1.jpg?width=3840&format=pjpg&auto=webp&s=4592cda3a575bbceecb9bc66e045044d2e2f4783');">
<header>
<img src="foto-profilo.jpg" alt="Foto Profilo di Matteo" class="profile-img">
<h1>@_matteo_nobile_</h1>
<p class="subtitle">Liceo Scientifico - Scienze Applicate</p>
</header>
<main class="container">
<a href="https://torricellimi.edu.it/" target="_blank" rel="noopener" class="btn">
<i class="fas fa-university"></i> Istituto Torricelli
</a>
<a href="mailto:fittizzia@gmail.com" class="btn">
<i class="fas fa-envelope"></i> Scrivimi via Email
</a>
<a href="https://www.instagram.com/la_storia_insegna_?igsh=ZzhnazhtNDBmdTA2" target="_blank" rel="noopener" class="btn">
<i class="fab fa-instagram"></i> la_storia_insegna_
</a>
<a href="https://it.linkedin.com/in/matteo-nobile-456ba43b9" target="_blank" rel="noopener" class="btn">
<i class="fab fa-linkedin"></i> Profilo Professionale
</a>
<a href="https://youtube.com" target="_blank" rel="noopener" class="btn">
<i class="fab fa-youtube"></i> Esplora su YouTube
</a>
</main>
<div class="toggle-container">
<button id="theme-toggle">Passa alla modalità notte</button>
</div>
<footer>
<p>Informatica • 2026</p>
</footer>
<script>
alert("Benvenuto nel mio Linktree Interattivo!");

const pulsante = document.getElementById('theme-toggle');
const corpo = document.body;

pulsante.addEventListener('click', () => {
corpo.classList.toggle('dark-mode');
if (corpo.classList.contains('dark-mode')) {
pulsante.innerText = "Passa alla modalità giorno";
} else {
pulsante.innerText = "Passa alla modalità notte";
}
});
</script>
</body>
</html>
